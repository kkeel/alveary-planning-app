name: Validate catalog foundation migration

on:
  pull_request:
    paths:
      - ".github/workflows/catalog-foundation-check.yml"
      - "docs/sql/catalog-foundation-review.sql"
      - "tests/sql/catalog-foundation-smoke.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres-validation:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Check out the review branch
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Create Supabase-like API roles in disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin;"
          psql -v ON_ERROR_STOP=1 -c "create role authenticated nologin;"

      - name: Execute proposed catalog SQL in isolated database
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/catalog-foundation-review.sql

      - name: Check RLS, release isolation, and shared course choices
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/catalog-foundation-smoke.sql

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Confirm the official migration command
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help

      - name: Generate migration filename through Supabase CLI
        run: |
          supabase migration new catalog_foundation
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path("supabase/migrations").glob("*_catalog_foundation.sql"))
          if len(matches) != 1:
              raise SystemExit(f"Expected one CLI-created migration, found {len(matches)}")
          draft = Path("docs/sql/catalog-foundation-review.sql").read_text()
          marker = "\nbegin;\n"
          if marker not in draft:
              raise SystemExit("Could not locate reviewed SQL transaction")
          matches[0].write_text(
              "-- Alveary curriculum catalog foundation; generated by Supabase CLI.\n"
              "-- Needs GitHub review before application to a development database.\n\n"
              + "begin;\n" + draft.split(marker, 1)[1]
          )
          print(f"Generated migration artifact: {matches[0]}")
          PY

      - name: Upload CLI-created migration for review
        uses: actions/upload-artifact@v4
        with:
          name: catalog-foundation-cli-migration
          path: supabase/migrations/*_catalog_foundation.sql
          if-no-files-found: error
